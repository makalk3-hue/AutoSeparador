
name: Gerar APK Auto Separador

on:
  workflow_dispatch:
  push:
    paths:
      - 'AutoSeparador-GitHub.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Extrair projeto
        run: |
          unzip -q AutoSeparador-GitHub.zip -d fonte

      - name: Compilar APK
        run: |
          gradle -p fonte/AutoSeparador assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoSeparador-APK
          path: fonte/AutoSeparador/app/build/outputs/apk/debug/app-debug.apk
